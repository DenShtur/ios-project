name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest
    - name: Build project
      run: xcodebuild -scheme Demo-Speckit-messageApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14' build
    - name: Run tests
      run: xcodebuild test -scheme Demo-Speckit-messageApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14'
